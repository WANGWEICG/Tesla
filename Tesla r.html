<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla 車貸試算器</title>
<style>
body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif}
.wrap{max-width:520px;margin:auto;padding:16px}
h1{font-size:24px;margin:10px 0}
.card{background:#17171a;border:1px solid #303038;border-radius:18px;padding:16px;margin:12px 0}
label{display:block;color:#a0a4b0;font-size:14px;margin:12px 0 6px}
input,select{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #3a3b44;background:#0f1013;color:#fff;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#2f7cf6;color:#fff;font-size:18px;font-weight:700;margin-top:14px}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #303038;padding:12px 0;gap:12px}
.row:last-child{border-bottom:0}
.k{color:#a0a4b0}.v{text-align:right;font-weight:800}.big{font-size:28px;color:#22c55e}
.note{font-size:13px;line-height:1.5;color:#a0a4b0}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border-bottom:1px solid #303038;padding:10px 4px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:#a0a4b0}
</style>
</head>
<body>
<div class="wrap">
<h1>Tesla 車貸試算器</h1>
<p class="note">依你截圖的算法：總利息用 Tesla 表格比例反推；月付採「貸款金額 ÷ 期數」。</p>

<div class="card">
<label>車價 NT$</label>
<input id="price" type="number" value="2010900">

<div class="grid">
<div>
<label>頭期款 NT$</label>
<input id="down" type="number" value="800000">
</div>
<div>
<label>利率 %</label>
<input id="rate" type="number" step="0.01" value="2.13">
</div>
</div>

<label>期數</label>
<select id="months">
<option value="36">36期 / 3年</option>
<option value="48">48期 / 4年</option>
<option value="60">60期 / 5年</option>
<option value="72">72期 / 6年</option>
<option value="84" selected>84期 / 7年</option>
</select>

<button id="calcBtn">計算</button>
</div>

<div class="card">
<div class="row"><span class="k">貸款金額</span><span class="v" id="loan">-</span></div>
<div class="row"><span class="k">月付款</span><span class="v big" id="monthly">-</span></div>
<div class="row"><span class="k">總利息</span><span class="v" id="interest">-</span></div>
<div class="row"><span class="k">頭期款＋總利息</span><span class="v" id="downInterest">-</span></div>
<div class="row"><span class="k">車價＋總利息</span><span class="v" id="totalCost">-</span></div>
</div>

<div class="card">
<b>各期數比較</b>
<table>
<thead><tr><th>期數</th><th>月付</th><th>總利息</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<p class="note">提醒：這是依截圖反推的估算工具，實際合約金額可能會因手續費、保險、領牌費、金融方案而不同。</p>
</div>

<script>
var factors = {
  36: 0.5039161809782639,
  48: 0.496482928053157,
  60: 0.4910822320479869,
  72: 0.48591958324965634,
  84: 0.48156001678648735
};

function val(id){
  var x = document.getElementById(id).value;
  x = String(x).replace(/,/g,'');
  var n = parseFloat(x);
  return isNaN(n) ? 0 : n;
}

function money(n){
  return "NT$ " + Math.round(n).toLocaleString("zh-TW");
}

function calcByMonth(m){
  var price = val("price");
  var down = val("down");
  var rate = val("rate") / 100;
  var loan = price - down;
  if(loan < 0){ loan = 0; }

  var interest = loan * rate * (m / 12) * factors[m];
  var monthly = loan / m;

  return {
    loan: loan,
    interest: interest,
    monthly: monthly,
    downInterest: down + interest,
    totalCost: price + interest
  };
}

function calc(){
  var m = parseInt(document.getElementById("months").value,10);
  var r = calcByMonth(m);

  document.getElementById("loan").innerText = money(r.loan);
  document.getElementById("monthly").innerText = money(r.monthly);
  document.getElementById("interest").innerText = money(r.interest);
  document.getElementById("downInterest").innerText = money(r.downInterest);
  document.getElementById("totalCost").innerText = money(r.totalCost);

  var html = "";
  [36,48,60,72,84].forEach(function(mm){
    var x = calcByMonth(mm);
    html += "<tr><td>"+mm+"期</td><td>"+money(x.monthly)+"</td><td>"+money(x.interest)+"</td></tr>";
  });
  document.getElementById("tbody").innerHTML = html;
}

document.getElementById("calcBtn").onclick = calc;
document.getElementById("price").oninput = calc;
document.getElementById("down").oninput = calc;
document.getElementById("rate").oninput = calc;
document.getElementById("months").onchange = calc;

window.onload = calc;
calc();
</script>
</body>
</html>
