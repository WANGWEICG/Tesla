<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e14"><title>充電紀錄與電費統計｜特斯拉助手</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#0b0e14;color:#f5f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:26px 16px 80px}a{color:#e98b90}header a{color:#a7b4c7;text-decoration:none;font-size:14px}h1{font-size:30px;margin:16px 0 6px}h1 span{color:#ee565f}h2{font-size:19px;margin:0 0 14px}.muted,.hint{color:#aab6c6;font-size:13px;line-height:1.65}.card{background:#171e2b;border:1px solid #344055;border-radius:20px;padding:19px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;color:#bdc9d8;font-size:13px;margin-bottom:5px}input,select{width:100%;padding:12px;background:#0c1420;border:1px solid #46556a;border-radius:11px;color:#fff;font-size:16px}input:focus,select:focus{outline:2px solid #ec6972}.full{grid-column:1/-1}button{border:1px solid #58677a;border-radius:11px;padding:11px 14px;background:#28354a;color:#fff;font-weight:700;cursor:pointer}.primary{background:#be3945;border-color:#e56b74}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stat{background:#0c1420;border-radius:13px;padding:14px}.stat small{color:#aab8ca;display:block;font-size:12px}.stat strong{display:block;font-size:22px;margin-top:7px}.list{display:grid;gap:10px}.entry{border:1px solid #38485d;border-radius:13px;padding:13px;background:#0d1521;display:flex;gap:12px;justify-content:space-between;align-items:center}.entry strong{display:block}.entry small{display:block;color:#aebacd;line-height:1.6}.entry button{font-size:12px;padding:7px 9px}.error{color:#ffa6a6;font-size:13px;min-height:1.3em}.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:65px 1fr 82px;gap:8px;align-items:center;font-size:12px}.track{background:#0c1420;border-radius:6px;height:13px;overflow:hidden}.fill{background:#e35b65;height:100%}.barrow span:last-child{text-align:right;color:#b6c2d2}@media(max-width:420px){.grid{gap:9px}.stat strong{font-size:18px}.card{padding:15px}.barrow{grid-template-columns:56px 1fr 70px}}
</style></head><body><main><header><a href="../">‹ 返回特斯拉助手首頁</a><h1>充電<span>紀錄</span></h1><p class="muted">記錄每次充電的度數與費用，自動統計每月支出。資料僅儲存在此瀏覽器裝置中。</p></header>
<section class="card"><h2>新增充電紀錄</h2><form id="form"><div class="grid">
<div><label for="date">充電日期</label><input id="date" type="date" required></div>
<div><label for="type">充電地點</label><select id="type"><option value="家用">家用</option><option value="超充">超充</option><option value="其他">其他</option></select></div>
<div><label for="kwh">牆端／帳單用電量（kWh）</label><input id="kwh" type="number" min="0.01" max="2000" step="0.01" placeholder="例如 32.5" required></div>
<div><label for="price">每度單價（NT$）</label><input id="price" type="number" min="0" max="1000" step="0.01" value="3" required></div>
<div class="full"><label for="cost">實際帳單金額（NT$，選填）</label><input id="cost" type="number" min="0" max="1000000" step="0.01" placeholder="留空則用度數 × 單價估算"></div>
<div class="full"><label for="note">備註（選填）</label><input id="note" type="text" maxlength="100" placeholder="例如：家用夜間充電"></div>
</div><p class="hint">若有充電站帳單，建議輸入實際金額（可包含站方費用）；若留空則依輸入單價估算。用電量應採同一口徑以利比較。</p><div class="error" id="error" role="alert"></div><button class="primary" type="submit">＋ 儲存充電紀錄</button></form></section>
<section class="card"><h2>每月電費統計</h2><div class="grid"><div><label for="month">選擇月份</label><input id="month" type="month"></div><div><label for="filter">充電類型</label><select id="filter"><option value="全部">全部</option><option value="家用">家用</option><option value="超充">超充</option><option value="其他">其他</option></select></div></div><div class="grid" style="margin-top:14px"><div class="stat"><small>當月總電費</small><strong id="sumCost">NT$ 0</strong></div><div class="stat"><small>當月用電量</small><strong id="sumKwh">0 kWh</strong></div><div class="stat"><small>充電次數</small><strong id="count">0 次</strong></div><div class="stat"><small>平均每度成本</small><strong id="avg">NT$ 0</strong></div></div></section>
<section class="card"><h2>最近六個月電費</h2><div id="bars" class="bars"></div><p class="hint">圖表依目前選取的充電類型統計，不受月份篩選限制。</p></section>
<section class="card"><h2>充電明細</h2><div id="entries" class="list"></div><div class="actions"><button id="export" type="button">匯出 CSV 備份</button><button id="exportJson" type="button">匯出 JSON 備份</button><button id="importBtn" type="button">匯入 JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden><button id="clear" type="button">清除全部紀錄</button></div><p class="hint">更換手機、清除 Safari 網站資料或移除 App 可能遺失紀錄；請定期匯出 JSON 備份。匯入 JSON 會合併並依紀錄 ID 去重。</p></section>
</main><script src="./app.js" defer></script></body></html>
